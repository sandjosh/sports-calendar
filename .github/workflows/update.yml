name: Update Sports Calendar

on:
  schedule:
    - cron: '0 6 * * *'  # Runs daily at 6am UTC
  workflow_dispatch:       # Also lets you trigger it manually

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run fetch script
        run: python fetch_games.py

      - name: Commit and push updated files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.html nfl.ics nba.ics mlb.ics nhl.ics
          git diff --staged --quiet || git commit -m "Update sports calendar $(date -u '+%Y-%m-%d')"
          git push
